<svg width="180" height="42" viewBox="0 0 180 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="harvestoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Icon: Modern Leaf & Basket Sprout -->
  <g transform="translate(4, 3)">
    <!-- Harvest Basket Arc -->
    <path d="M4 18 C 6 28, 26 28, 28 18 L 30 14 L 2 14 Z" fill="url(#harvestoGrad)" />
    <!-- Vibrant Organic Sprout Leaves -->
    <path d="M16 14 C 16 6, 26 2, 28 8 C 28 14, 20 15, 16 14 Z" fill="#34D399" />
    <path d="M16 14 C 16 7, 6 4, 4 9 C 4 15, 12 15, 16 14 Z" fill="url(#harvestoGrad)" />
    <!-- Sunlight Golden Fruit / Sun Accent -->
    <circle cx="16" cy="6" r="3.5" fill="url(#sunGrad)" />
  </g>

  <!-- Wordmark: Harvesto -->
  <text x="44" y="27" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5px" fill="#0F172A">
    Harvest<tspan fill="#059669">o</tspan>
  </text>
  
  <!-- Mini Subtitle Badge -->
  <text x="45" y="37" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5px" fill="#64748B" text-transform="uppercase">
    FRESH GROCERIES
  </text>
</svg>
