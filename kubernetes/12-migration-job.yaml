apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: harvesto
spec:
  template:
    spec:
      containers:
      - name: migration
        image: rameshwarrm/harvesto-migration:1
        imagePullPolicy: Always
        env:
        - name: MONGODB_URI
          value: "mongodb://mongodb-service:27017/harvesto"
      restartPolicy: OnFailure