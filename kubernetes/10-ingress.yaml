apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: harvesto-ingress
  namespace: harvesto
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  tls:
    - hosts:
      - harvesto.letsdeployit.com
      secretName: harvesto-tls-secret  
    rules:
    - host: harvesto.letsdeployit.com
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: harvesto-service
              port:
                number: 80