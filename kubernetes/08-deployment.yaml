apiVersion: apps/v1
kind: Deployment

metadata:
  name: harvesto
  namespace: harvesto

spec:
  replicas: 2
  selector:
    matchLabels:
      app: harvesto
  template:
    metadata:
      labels:
        app: harvesto-app
    spec:
      containers:
        - name: harvesto-app
          image: rameshwarrm/harvesto-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: harvesto-secrets
                  key: MONGODB_URI
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: harvesto-secrets
                  key: JWT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

