apiVersion: apps/v1
kind: Deployment

metadata:
  name: harvesto
  namespace: harvesto

spec:
  replicas: 2
  selector:
    matchLabels:
      app: harvesto
  template:
    metadata:
      labels:
        app: harvesto
    spec:
      containers:
        - name: harvesto
          image: rameshwarrm/harvesto-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
              name: harvesto-config
            - secretRef:
              name: harvesto-secrets

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: harvesto-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

