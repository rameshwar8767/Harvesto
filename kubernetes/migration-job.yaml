apiVersion: batch/v1
kind: Job
metadata:
  name: harvesto-db-migration
  labels:
    app: harvesto-migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: harvesto-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration-runner
          image: rameshwarrm/harvesto-migration:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: harvesto-secrets
                  key: MONGODB_URI
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

